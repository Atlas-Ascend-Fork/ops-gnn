[build-system]
requires = ["setuptools>=64", "wheel", "torch>=1.8"]
build-backend = "setuptools.build_meta"

# Distribution metadata lives in setup.py/setup.cfg so its version can include
# the selected CANN device label (950/a2/a3).

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
addopts = "--capture=no"
markers = [
    "npu: requires an Ascend NPU and the compiled ops_gnn extension",
]
filterwarnings = [
    'ignore:`torch\.jit\.script_method` is deprecated\..*:DeprecationWarning',
]

[tool.cibuildwheel]
test-command = "python -c \"import ops_gnn; print(ops_gnn.__version__)\""
