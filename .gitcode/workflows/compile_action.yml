name: compile_action

on:
  workflow_call:
    inputs:
      task_name:
        required: true
        type: string
      image_version:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: 'x64'
      package_name:
        required: false
        type: string
        default: ''
    outputs:
      arm_run_url:
        value: ${{jobs.JOB_compile.outputs.primary-url}}
      arm_run_key:
        value: ${{jobs.JOB_compile.outputs.primary-key}}

jobs:
  JOB_compile:
    name: Compile
    steps:
      -
        name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          allow-unsafe-pr-checkout: true
      -
        name: download
        uses: obs-download
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          key: |
            ${{ env.obs_path }}/pr_filelist.txt
            ${{ env.obs_path }}/pr_filelist_mod.txt
            ${{ env.obs_path }}/update_file_detail.txt
            ${{ env.obs_path }}/compile.sh
          path: ${{ steps.process_checkout.outputs.path }}
      -
        name: arm_compile_acc
        identifier: compile
        uses: build-accelerate
        with:
          command: |
            export WORKSPACE=${{ steps.process_checkout.outputs.path }}
            cd ${{ steps.process_checkout.outputs.path }}
            export task_name=${{ inputs.task_name }}
            export target_branch=${{ env.TARGET_BRANCH }}
            BuildAccelerate bash compile.sh
          AC_SERVER_IP: ${{ vars.AC_SERVER_IP }}
      -
        name: rename_package
        if: ${{ inputs.package_name != '' }}
        run: |
          if [[ "${{ inputs.package_name }}" == *.so ]]; then
            mv "${{ steps.process_checkout.outputs.path }}/output/kernel/"${{ inputs.package_name }} "${{ steps.process_checkout.outputs.path }}/output/"
            echo "mv: ${{ steps.process_checkout.outputs.path }}/output/kernel/${{ inputs.package_name }} -> ${{ steps.process_checkout.outputs.path }}/output/"
          fi
          if [[ "${{ inputs.package_name }}" == *.whl ]]; then
            mv ${{ steps.process_checkout.outputs.path }}/output/whl/ops_gnn*.whl ${{ steps.process_checkout.outputs.path }}/output/${{ inputs.package_name }}
            echo "mv: ${{ steps.process_checkout.outputs.path }}/output/whl/ops_gnn*.whl -> ${{ steps.process_checkout.outputs.path }}/output/${{ inputs.package_name }}"
          fi
      - name: upload
        uses: obs-upload
        with:
          endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
          bucket: "ascend-ci"
          access-key: ${{ secrets.AK }}
          secret-key: ${{ secrets.SK }}
          artifact-path: "${{ steps.process_checkout.outputs.path }}/output/${{ inputs.package_name }}"
          object-prefix: ${{ env.obs_path }}/
    if: "${{ default() }}"
    runs-on:
      - self-hosted
      - arch=${{ inputs.arch }}
      - spec=xlarge
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.image_version }}
